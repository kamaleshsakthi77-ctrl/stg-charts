<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swing Trading Guide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Swing Trading Guide">
<style>
html,body{margin:0;height:100%;background:#0B1F3A;color:#fff;font-family:system-ui,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:0 20px}
img{width:96px;height:96px;border-radius:50%;background:#fff;animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.06)}}
h1{font-size:20px;margin:0}p{margin:0;color:#9fb3c8;font-size:14px;max-width:320px}
button,a{border:0;font-size:16px;cursor:pointer;background:#2E8B98;color:#fff;text-decoration:none;padding:12px 22px;border-radius:12px;font-weight:600;font-family:inherit}
button.ghost,a.ghost{background:none;color:#9fb3c8;font-weight:500;font-size:14px;text-decoration:underline;padding:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){img{animation:none}}
</style></head><body>
<img src="icon-192.png" alt="Swing Trading Guide">
<h1>Swing Trading Guide</h1>
<p id="msg">Install this app for one-tap access to today's lists.</p>
<p id="dg" hidden></p>
<button id="set" class="ghost" hidden>Alert settings</button>
<button id="inst" hidden>Install app</button>
<button id="al" hidden>Turn on daily alerts</button>
<a id="go" href="https://script.google.com/macros/s/AKfycbxkRSULWATLQwxj0GhB_3SXFuANh6-yzJfJs0V6xSLYn2qM8PoILXMppeP_xfqtrLSr/exec" target="_top">Open the lists</a>
<button id="off" class="ghost" hidden>Turn off alerts</button>
<p id="ios" hidden>iPhone: tap Share, then Add to Home Screen, then open the app to turn on alerts.</p>
<script>
var X="https://script.google.com/macros/s/AKfycbxkRSULWATLQwxj0GhB_3SXFuANh6-yzJfJs0V6xSLYn2qM8PoILXMppeP_xfqtrLSr/exec", API="https://script.google.com/macros/s/AKfycbyiXbxp7NyHabmke7lqzNi3K-xtfBU5FDkfNAh7tonvwM6dSFux-WhbX3-w3ZhAJUEa/exec", KEY="BNymRV37OoIvjxtGxtzMGDARIWHNUc1RabSO-KVGjo5fes1o7sfrEcLoB0yIIS8dSwsonbObSNo0ArXx58WdAU8", dp, $=function(i){return document.getElementById(i)};
var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
var ios = /iphone|ipad/i.test(navigator.userAgent);
var can = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function b64(s){var p="=".repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,"+").replace(/_/g,"/"),r=atob(b),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function post(o){return fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(o)})}
var KEY=(location.search.match(/[?&]k=([0-9a-f]{32})/)||[])[1]||ls("stgKey")||"";
if(KEY){ls("stgKey",KEY);X=X+"?k="+KEY;$("go").href=X;
  try{var mf=JSON.parse(JSON.stringify({name:"Swing Trading Guide",short_name:"Swing Trading Guide",start_url:"./?k="+KEY,scope:"./",display:"standalone",orientation:"portrait",background_color:"#0B1F3A",theme_color:"#0B1F3A",
    icons:[{src:new URL("icon-192.png",location.href).href,sizes:"192x192",type:"image/png",purpose:"any"},{src:new URL("icon-512.png",location.href).href,sizes:"512x512",type:"image/png",purpose:"any"},{src:new URL("icon-512.png",location.href).href,sizes:"512x512",type:"image/png",purpose:"maskable"}]}));
    document.querySelector('link[rel=manifest]').href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}))}catch(e){}
}else{$("msg").textContent="Open your personal Swing Trading Guide link once to set up this app.";$("go").hidden=true}
var regp = "serviceWorker" in navigator ? navigator.serviceWorker.register("sw.js").then(function(){return navigator.serviceWorker.ready}) : Promise.resolve(null);
function state(sub){
  var on = !!sub && Notification.permission==="granted";
  $("al").hidden = !can || on || Notification.permission==="denied" || (ios && !standalone);
  $("off").hidden = !on;
  if(on) $("msg").textContent="Daily alerts are on. You will get two notes a day, at 1 pm and 7 pm, when the lists are ready.";
  else if(can && Notification.permission==="denied") $("msg").textContent="Alerts are blocked in this browser's settings.";
  return on}
function go(){location.replace(X)}
regp.then(function(reg){
  if(!reg||!can){ if(standalone) go(); return }
  reg.pushManager.getSubscription().then(function(sub){
    var on = state(sub);
    if(standalone){
      if(on || ls("stgSkip") || Notification.permission!=="default"){
        $("msg").textContent="Opening today's lists..."; $("dg").textContent="Alerts: "+(on?"on":"off")+" | permission: "+Notification.permission; $("dg").hidden=false; $("set").hidden=false;
        var tm=setTimeout(go,3500);
        $("set").onclick=function(){clearTimeout(tm);$("msg").textContent="Alert settings";$("set").hidden=true;$("al").hidden=false;$("al").disabled=false;$("al").textContent="Turn on / refresh alerts";$("go").textContent="Open the lists";$("off").hidden=!on}
      }
      else { $("msg").textContent="Get two alerts a day (1 pm and 7 pm) when the lists are ready?"; $("go").textContent="Skip for now"; $("go").onclick=function(e){ls("stgSkip","1")} }
    }
  })
});
$("al").onclick=function(){
  $("al").disabled=true;
  Notification.requestPermission().then(function(p){
    if(p!=="granted"){state(null);$("al").disabled=false;return}
    return regp.then(function(reg){return reg.pushManager.getSubscription().then(function(old){return old?old.unsubscribe().then(function(){return post({action:"unsub",endpoint:old.endpoint})}):null}).then(function(){return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(KEY)})})})
      .then(function(sub){return post({action:"sub",sub:sub.toJSON()}).then(function(){ls("stgAsked","1");state(sub);if(standalone)setTimeout(go,1800)})})
  }).catch(function(){$("msg").textContent="Could not turn on alerts. Please try again.";$("al").disabled=false})};
$("off").onclick=function(){regp.then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){
  if(!sub)return;var ep=sub.endpoint;return sub.unsubscribe().then(function(){return post({action:"unsub",endpoint:ep})})}).then(function(){$("msg").textContent="Alerts are off.";$("al").hidden=false;$("al").disabled=false;$("off").hidden=true})};
addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); dp=e; var b=$("inst"); b.hidden=false;
  b.onclick=function(){ dp.prompt(); dp.userChoice.then(function(){ b.hidden=true; }); }; });
if (ios && !standalone) $("ios").hidden=false;
</script></body></html>
